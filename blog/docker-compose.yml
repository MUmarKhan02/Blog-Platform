services:
  #Our PostgreSQL database
  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: changemeinprod!
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - blog_network

  #Database management interface
  adminer:
    image: adminer:latest
    ports:
      - 8888:8080
    restart: always
    networks:
      - blog_network

networks:
  blog_network:
    driver: bridge

volumes:
  postgres_data: